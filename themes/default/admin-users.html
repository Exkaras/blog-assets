<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员账号 - {{siteName}}</title>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #f0f9ff 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .navbar-custom {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(99, 102, 241, 0.08);
            border-radius: 20px;
            padding: 1.25rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            height: 100%;
        }
        
        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(79, 70, 229, 0.1);
        }
        
        .user-row {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        
        .user-row:hover {
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(99, 102, 241, 0.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
        }
        
        .btn-primary-custom {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            color: white;
        }
        
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
            color: white;
        }
        
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: none;
            text-decoration: none;
        }
        
        .icon-btn:hover {
            transform: scale(1.15);
        }
        
        .icon-btn.edit {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            color: #2563eb;
        }
        
        .icon-btn.delete {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #dc2626;
        }
        
        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .role-badge.superadmin {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #d97706;
        }
        
        .role-badge.admin {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            color: #2563eb;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .status-badge.active {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #059669;
        }
        
        .status-badge.inactive {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            color: #64748b;
        }
        
        .glass-modal {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(99, 102, 241, 0.08);
        }
        
        .form-control-custom {
            border: 2px solid #eef2ff;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }
        
        .form-control-custom:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            background: white;
        }
        
        .form-select-custom {
            border: 2px solid #eef2ff;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }
        
        .form-select-custom:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            color: white;
        }
        
        .notification {
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Focus-visible ring for accessibility */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #4f46e5 !important;
            outline-offset: 2px !important;
        }

        /* Respect prefers-reduced-motion */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .stat-card:hover, .user-row:hover, .btn-primary-custom:hover {
                transform: none !important;
            }
        }
    </style>
    
    {{codeBeforHead}}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar-custom sticky-top">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center py-3">
                <div class="d-flex align-items-center">
                    <div class="rounded-3 d-flex align-items-center justify-content-center me-3" 
                         style="width: 44px; height: 44px; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);">
                        <i class="fas fa-user-gear text-white fs-5"></i>
                    </div>
                    <div>
                        <h1 class="fs-5 fw-bold text-dark mb-0">管理员账号</h1>
                        <p class="text-muted small mb-0 d-none d-sm-block">管理团队账号</p>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <a href="/admin/" class="btn btn-outline-dark rounded-3 px-3 py-2 d-flex align-items-center gap-2">
                        <i class="fas fa-newspaper"></i>
                        <span class="d-none d-sm-inline">文章</span>
                    </a>
                    <button onclick="logout()" class="btn btn-outline-danger rounded-3 px-3 py-2 d-flex align-items-center gap-2">
                        <i class="fas fa-sign-out-alt"></i>
                        <span class="d-none d-sm-inline">退出登录</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <!-- Stats Cards -->
        <div class="row g-3 g-md-4 mb-4">
            <div class="col-6 col-sm-3">
                <button onclick="openAddAdminModal()" class="stat-card text-center w-100 border-0 bg-transparent">
                    <div class="rounded-3 d-flex align-items-center justify-content-center mx-auto mb-3" 
                         style="width: 56px; height: 56px; background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);">
                        <i class="fas fa-user-plus text-white fs-4"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">添加管理员</h3>
                    <p class="text-muted small mb-0">新建账号</p>
                </button>
            </div>

            <div class="col-6 col-sm-3">
                <div class="stat-card text-center">
                    <div class="rounded-3 d-flex align-items-center justify-content-center mx-auto mb-3" 
                         style="width: 56px; height: 56px; background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                        <i class="fas fa-users text-white fs-4"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-0" id="total-admins">-</h3>
                    <p class="text-muted small mb-0">管理员总数</p>
                </div>
            </div>

            <div class="col-6 col-sm-3">
                <div class="stat-card text-center">
                    <div class="rounded-3 d-flex align-items-center justify-content-center mx-auto mb-3" 
                         style="width: 56px; height: 56px; background: linear-gradient(135deg, #8b5cf6 0%, #a855f7 100%);">
                        <i class="fas fa-shield-halved text-white fs-4"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-0" id="superadmin-count">-</h3>
                    <p class="text-muted small mb-0">超级管理员</p>
                </div>
            </div>

            <div class="col-6 col-sm-3">
                <button onclick="openChangePasswordModal()" class="stat-card text-center w-100 border-0 bg-transparent">
                    <div class="rounded-3 d-flex align-items-center justify-content-center mx-auto mb-3" 
                         style="width: 56px; height: 56px; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">
                        <i class="fas fa-key text-white fs-4"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">密码</h3>
                    <p class="text-muted small mb-0">修改密码</p>
                </button>
            </div>
        </div>

        <!-- Users Management -->
        <div class="card border-0 shadow-sm mb-4" style="border-radius: 20px; background: rgba(255,255,255,0.95);">
            <div class="card-header border-0 bg-white px-4 py-3" style="border-radius: 20px 20px 0 0;">
                <div class="d-flex flex-column sm:flex-row sm:justify-content-between sm:align-items-center gap-3">
                    <div>
                        <h2 class="fw-bold text-dark mb-1">管理员账号</h2>
                        <p class="text-muted small mb-0">管理账号与权限</p>
                    </div>
                    <div class="d-flex gap-2">
                        <div class="position-relative">
                            <input type="text" id="search-admins" placeholder="搜索管理员" 
                                   class="form-control form-control-custom ps-5" style="min-width: 200px;" aria-label="搜索管理员" />
                            <i class="fas fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted" aria-hidden="true"></i>
                        </div>
                        <button onclick="loadAdmins()" class="btn btn-outline-dark rounded-3 px-3" aria-label="刷新管理员列表">
                            <i class="fas fa-redo" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body p-4">
                <div id="admins-list" aria-live="polite">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary mb-3" role="status">
                            <span class="visually-hidden">加载中…</span>
                        </div>
                        <p class="text-muted">正在加载管理员…</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- User Guide -->
        <div class="card border-0 shadow-sm" style="border-radius: 20px; background: rgba(255,255,255,0.95);">
            <div class="card-body p-4">
                <div class="d-flex align-items-start gap-3">
                    <div class="rounded-3 d-flex align-items-center justify-content-center flex-shrink-0" 
                         style="width: 48px; height: 48px; background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);">
                        <i class="fas fa-info text-white"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold text-dark mb-3">角色说明</h3>
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <div class="p-3 rounded-3" style="background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);">
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="role-badge superadmin"><i class="fas fa-shield-halved me-1"></i>Super Admin</span>
                                    </div>
                                    <p class="text-muted small mb-0 mt-2">拥有全部权限，可以管理账号</p>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="p-3 rounded-3" style="background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);">
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="role-badge admin"><i class="fas fa-user me-1"></i>管理员</span>
                                    </div>
                                    <p class="text-muted small mb-0 mt-2">只能管理内容</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加管理员 Modal -->
    <div id="add-admin-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header border-0 pb-0">
                    <div class="d-flex align-items-center gap-3">
                        <div class="rounded-3 d-flex align-items-center justify-content-center" 
                             style="width: 40px; height: 40px; background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);">
                            <i class="fas fa-user-plus text-white" aria-hidden="true"></i>
                        </div>
                        <h5 class="modal-title fw-bold">添加管理员</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>

                <form id="add-admin-form" class="p-4 pt-0">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">用户名 *</label>
                        <input type="text" id="username" required class="form-control form-control-custom" placeholder="输入用户名" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">密码 *</label>
                        <input type="password" id="password" required class="form-control form-control-custom" placeholder="输入密码" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">邮箱 *</label>
                        <input type="email" id="email" required class="form-control form-control-custom" placeholder="输入邮箱" />
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">角色 *</label>
                        <select id="role" required class="form-select form-select-custom w-100">
                            <option value="admin">管理员</option>
                            <option value="superadmin">Super Admin</option>
                        </select>
                    </div>

                    <div class="d-flex gap-3">
                        <button type="button" class="btn btn-light flex-fill py-2 rounded-3" data-bs-dismiss="modal">取消</button>
                        <button type="button" onclick="addAdmin()" class="btn btn-primary-custom flex-fill py-2 rounded-3">
                            <i class="fas fa-user-plus me-2"></i>添加管理员
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 编辑管理员 Modal -->
    <div id="edit-admin-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header border-0 pb-0">
                    <div class="d-flex align-items-center gap-3">
                        <div class="rounded-3 d-flex align-items-center justify-content-center" 
                             style="width: 40px; height: 40px; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);">
                            <i class="fas fa-edit text-white" aria-hidden="true"></i>
                        </div>
                        <h5 class="modal-title fw-bold">编辑管理员</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>

                <form id="edit-admin-form" class="p-4 pt-0">
                    <input type="hidden" id="edit-admin-id" />

                    <div class="mb-3">
                        <label class="form-label fw-semibold">用户名</label>
                        <input type="text" id="edit-username" readonly class="form-control form-control-custom bg-light text-muted" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">邮箱 *</label>
                        <input type="email" id="edit-email" required class="form-control form-control-custom" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">角色 *</label>
                        <select id="edit-role" required class="form-select form-select-custom w-100">
                            <option value="admin">管理员</option>
                            <option value="superadmin">Super Admin</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">状态 *</label>
                        <select id="edit-status" required class="form-select form-select-custom w-100">
                            <option value="active">启用</option>
                            <option value="inactive">停用</option>
                        </select>
                    </div>

                    <div class="d-flex gap-3">
                        <button type="button" class="btn btn-light flex-fill py-2 rounded-3" data-bs-dismiss="modal">取消</button>
                        <button type="button" onclick="updateAdmin()" class="btn btn-primary-custom flex-fill py-2 rounded-3">
                            <i class="fas fa-save me-2"></i>保存修改
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 修改密码 Modal -->
    <div id="change-password-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header border-0 pb-0">
                    <div class="d-flex align-items-center gap-3">
                        <div class="rounded-3 d-flex align-items-center justify-content-center" 
                             style="width: 40px; height: 40px; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">
                            <i class="fas fa-key text-white" aria-hidden="true"></i>
                        </div>
                        <h5 class="modal-title fw-bold">修改密码</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>

                <form id="change-password-form" class="p-4 pt-0">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">当前密码 *</label>
                        <input type="password" id="current-password" required class="form-control form-control-custom" placeholder="输入当前密码" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">新密码 *</label>
                        <input type="password" id="new-password" required minlength="6" class="form-control form-control-custom" placeholder="输入新密码（至少 6 位）" />
                        <p class="text-muted small mt-2">密码至少要 6 位。</p>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">确认新密码 *</label>
                        <input type="password" id="confirm-new-password" required minlength="6" class="form-control form-control-custom" placeholder="再输一遍新密码" />
                        <p id="password-match-error" class="text-danger small mt-2 d-none">两次密码不一致。</p>
                    </div>

                    <div class="d-flex gap-3">
                        <button type="button" class="btn btn-light flex-fill py-2 rounded-3" data-bs-dismiss="modal">取消</button>
                        <button type="button" onclick="changePassword()" class="btn btn-primary-custom flex-fill py-2 rounded-3">
                            <i class="fas fa-key me-2"></i>修改密码
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentAdmins = [];
        let addAdminModal, editAdminModal, changePasswordModal;

        document.addEventListener('DOMContentLoaded', function () {
            addAdminModal = new bootstrap.Modal(document.getElementById('add-admin-modal'));
            editAdminModal = new bootstrap.Modal(document.getElementById('edit-admin-modal'));
            changePasswordModal = new bootstrap.Modal(document.getElementById('change-password-modal'));
            
            // Strip credentials from URL to prevent fetch issues
            if (window.location.href.includes('@')) {
                const newUrl = window.location.href.replace(/\/\/.*@/, '//');
                history.replaceState(null, '', newUrl);
            }
            
            loadAdmins();

            document.getElementById('search-admins').addEventListener('input', function (e) {
                filterAdmins(e.target.value);
            });
        });

        async function loadAdmins() {
            try {
                const response = await fetch(window.location.origin + '/api/admins');
                if (!response.ok) {
                    if (response.status === 401) {
                        showNotification('登录已失效，请重新登录。', 'error');
                        return;
                    }
                    if (response.status === 403) {
                        showNotification('没有权限，只有超级管理员能管理账号。', 'error');
                        return;
                    }
                    throw new Error('管理员加载失败');
                }
                currentAdmins = await response.json();
                displayAdmins(currentAdmins);
                updateStats();
            } catch (error) {
                console.error('加载管理员出错：', error);
                showNotification('加载管理员出错：' + error.message, 'error');
            }
        }

        function displayAdmins(admins) {
            const container = document.getElementById('admins-list');

            if (admins.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-user-search text-muted mb-3" style="font-size: 2rem; opacity: 0.3;"></i>
                        <h3 class="fw-bold text-dark mb-2">还没有管理员账号</h3>
                        <p class="text-muted mb-4">先添加第一个管理员账号吧</p>
                        <button onclick="openAddAdminModal()" class="btn btn-primary-custom text-white">
                            <i class="fas fa-user-plus me-2"></i>添加管理员
                        </button>
                    </div>
                `;
                return;
            }

            const colors = ['from-primary to-secondary', 'from-secondary to-tertiary', 'from-tertiary to-primary'];

            container.innerHTML = admins.map((admin, index) => `
                <div class="user-row">
                    <div class="d-flex flex-column sm:flex-row sm:align-items-center gap-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="avatar bg-gradient-to-br ${colors[index % colors.length]}" 
                                 style="background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);">
                                ${admin.username.charAt(0).toUpperCase()}
                            </div>
                            <div class="min-w-0">
                                <h3 class="fw-semibold text-dark mb-0">${admin.username}</h3>
                                <p class="text-muted small mb-0 truncate">${admin.email}</p>
                            </div>
                        </div>
                        <div class="d-flex align-items-center flex-wrap gap-2 ms-0 sm:ms-5">
                            <span class="role-badge ${admin.role === 'superadmin' ? 'superadmin' : 'admin'}">
                                <i class="fas ${admin.role === 'superadmin' ? 'fa-shield-halved' : 'fa-user'} me-1"></i>${admin.role}
                            </span>
                            <span class="status-badge ${admin.status === 'active' ? 'active' : 'inactive'}">
                                <i class="fas ${admin.status === 'active' ? 'fa-check-circle' : 'fa-times-circle'} me-1"></i>${admin.status}
                            </span>
                        </div>
                        <div class="d-flex gap-2 ms-0 sm:ms-5">
                            <button onclick="editAdmin('${admin.id}')" class="icon-btn edit" title="编辑" aria-label="编辑管理员 ${admin.username}">
                                <i class="fas fa-edit" aria-hidden="true"></i>
                            </button>
                            <button onclick="deleteAdmin('${admin.id}', '${admin.username}')" 
                                    class="icon-btn delete" 
                                    title="删除"
                                    aria-label="删除管理员 ${admin.username}"
                                    ${admin.role === 'superadmin' ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''}>
                                <i class="fas fa-trash" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterAdmins(searchTerm) {
            const filteredAdmins = currentAdmins.filter(
                (admin) => admin.username.toLowerCase().includes(searchTerm.toLowerCase()) || 
                           admin.email.toLowerCase().includes(searchTerm.toLowerCase()) || 
                           admin.role.toLowerCase().includes(searchTerm.toLowerCase())
            );
            displayAdmins(filteredAdmins);
        }

        function updateStats() {
            const totalAdmins = currentAdmins.length;
            const superadminCount = currentAdmins.filter((admin) => admin.role === 'superadmin').length;

            document.getElementById('total-admins').textContent = totalAdmins;
            document.getElementById('superadmin-count').textContent = superadminCount;
        }

        function openAddAdminModal() {
            addAdminModal.show();
            document.getElementById('add-admin-form').reset();
        }

        async function addAdmin() {
            const formData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                email: document.getElementById('email').value,
                role: document.getElementById('role').value,
            };

            try {
                const response = await fetch(window.location.origin + '/api/admins', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData),
                });

                if (response.ok) {
                    showNotification('管理员已创建');
                    addAdminModal.hide();
                    loadAdmins();
                } else {
                    if (response.status === 403) {
                        showNotification('没有权限，只有超级管理员能管理账号。', 'error');
                        return;
                    }
                    const error = await response.json();
                    throw new Error(error.error || '创建管理员失败');
                }
            } catch (error) {
                console.error('创建管理员出错：', error);
                showNotification('创建管理员出错：' + error.message, 'error');
            }
        }

        async function editAdmin(adminId) {
            const admin = currentAdmins.find((a) => a.id === adminId);
            if (!admin) return;

            document.getElementById('edit-admin-id').value = admin.id;
            document.getElementById('edit-username').value = admin.username;
            document.getElementById('edit-email').value = admin.email;
            document.getElementById('edit-role').value = admin.role;
            document.getElementById('edit-status').value = admin.status;

            editAdminModal.show();
        }

        async function updateAdmin() {
            const adminId = document.getElementById('edit-admin-id').value;
            const updateData = {
                email: document.getElementById('edit-email').value,
                role: document.getElementById('edit-role').value,
                status: document.getElementById('edit-status').value,
            };

            try {
                const response = await fetch(window.location.origin + '/api/admins/' + adminId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData),
                });

                if (response.ok) {
                    showNotification('管理员已更新');
                    editAdminModal.hide();
                    loadAdmins();
                } else {
                    if (response.status === 403) {
                        showNotification('没有权限，只有超级管理员能管理账号。', 'error');
                        return;
                    }
                    const error = await response.json();
                    throw new Error(error.error || '更新管理员失败');
                }
            } catch (error) {
                console.error('更新管理员出错：', error);
                showNotification('更新管理员出错：' + error.message, 'error');
            }
        }

        async function deleteAdmin(adminId, username) {
            if (!confirm(`Are you sure you want to delete admin "${username}"? This action cannot be undone.`)) return;

            try {
                const response = await fetch(window.location.origin + '/api/admins/' + adminId, { method: 'DELETE' });

                if (response.ok) {
                    showNotification('管理员已删除');
                    loadAdmins();
                } else {
                    if (response.status === 403) {
                        showNotification('没有权限，只有超级管理员能管理账号。', 'error');
                        return;
                    }
                    const error = await response.json();
                    throw new Error(error.error || '删除管理员失败');
                }
            } catch (error) {
                console.error('删除管理员出错：', error);
                showNotification('删除管理员出错：' + error.message, 'error');
            }
        }

        function openChangePasswordModal() {
            changePasswordModal.show();
            document.getElementById('change-password-form').reset();
            document.getElementById('password-match-error').classList.add('d-none');
        }

        function validatePasswordMatch() {
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-new-password').value;
            const errorElement = document.getElementById('password-match-error');

            if (confirmPassword && newPassword !== confirmPassword) {
                errorElement.classList.remove('d-none');
                return false;
            }
            errorElement.classList.add('d-none');
            return true;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const confirmPasswordField = document.getElementById('confirm-new-password');
            if (confirmPasswordField) {
                confirmPasswordField.addEventListener('input', validatePasswordMatch);
            }
        });

        async function changePassword() {
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-new-password').value;

            if (!currentPassword || !newPassword || !confirmPassword) {
                showNotification('所有字段都要填', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showNotification('新密码至少要 6 位', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showNotification('两次新密码不一致', 'error');
                return;
            }

            try {
                const response = await fetch(window.location.origin + '/api/admins/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        currentPassword,
                        newPassword
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    showNotification('密码修改成功', 'success');
                    changePasswordModal.hide();
                    document.getElementById('change-password-form').reset();
                } else {
                    throw new Error(data.error || '修改密码失败');
                }
            } catch (error) {
                console.error('修改密码出错：', error);
                showNotification(error.message, 'error');
            }
        }

        async function logout() {
            try {
                await fetch(window.location.origin + '/api/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (error) {
                showNotification('退出失败', 'error');
            }
        }

        function showNotification(message, type = 'success') {
            const colors = {
                success: 'bg-success',
                warning: 'bg-warning',
                error: 'bg-danger',
                info: 'bg-primary'
            };
            
            const icons = {
                success: 'fa-check-circle',
                warning: 'fa-exclamation-triangle',
                error: 'fa-times-circle',
                info: 'fa-info-circle'
            };
            
            const notification = document.createElement('div');
            notification.setAttribute('role', 'status');
            notification.setAttribute('aria-live', 'polite');
            notification.className = `notification fixed-top-0 end-0 m-3 p-3 rounded-3 shadow-lg text-white fw-medium d-flex align-items-center gap-2 ${colors[type] || colors.info}`;
            notification.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 250px;';
            notification.innerHTML = `<i class="fas ${icons[type] || icons.info}" aria-hidden="true"></i><span>${message}</span>`;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.transform = 'translateX(120%)';
                notification.style.opacity = '0';
                notification.style.transition = 'all 0.5s ease';
                setTimeout(() => {
                    if (document.body.contains(notification)) {
                        document.body.removeChild(notification);
                    }
                }, 500);
            }, 3000);
        }
    </script>
